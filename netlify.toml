# Build configuration, kept in the repo rather than the Netlify dashboard so it
# is reviewable, travels with the code, and a new developer can see what the
# deploy actually does without being given access to a settings page.
#
# Settings here override the dashboard.

[build]
  # Migrations run before the build so the schema is in place for static
  # generation, which queries the database at build time.
  command = "pnpm payload migrate && pnpm build"
  publish = ".next"

[build.environment]
  # Older Node versions fail this build; pin it rather than inherit the default.
  NODE_VERSION = "22"

  # Netlify's secrets scan fails the build when it finds the value of any env
  # var marked "secret" in the build output. Two of ours are public on purpose:
  # - cloudflare_r2 is the public bucket URL. next.config.ts inlines it into
  #   client bundles and every image URL.
  # - R2_BUCKET is the bucket name, which also appears in the contact email
  #   shown on every page.
  # Skipping them here is easier than deleting and recreating them in the
  # dashboard, since Netlify cannot unmark a variable once it is secret.
  SECRETS_SCAN_OMIT_KEYS = "cloudflare_r2,R2_BUCKET"
  # Turbopack's build cache records the env values it was built with, real
  # secrets included. The Next.js runtime moves .next to .netlify/.next before
  # the scan, saves cache/ to Netlify's private build cache, and deploys only
  # .netlify/static plus the server function, neither of which includes cache/.
  # The scanner matches the start of the path (or a full glob), not a substring,
  # so this must be the full path from the repo root.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/"
